<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINAL // CONCRETE PARACHUTE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030503;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      perspective: 1000px;
    }

    /* Retro CRT Glass Shell */
    .crt-container {
      width: 100%;
      max-width: 850px;
      min-height: 80vh;
      background: #09100a;
      border: 3px solid #00aa44;
      border-radius: 20px / 15px;
      padding: 30px;
      box-shadow: 
        0 0 30px rgba(0, 255, 102, 0.2),
        inset 0 0 40px rgba(0, 255, 102, 0.15),
        inset 0 0 100px rgba(0, 0, 0, 0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      transform: rotateX(1deg) scale(0.99);
      animation: crtFlicker 0.15s infinite alternate;
    }

    /* Scanlines Overlay */
    .crt-container::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Screen Reflection Vignette */
    .crt-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
      z-index: 11;
      pointer-events: none;
    }

    /* Phosphor Glow on Text */
    .terminal-output, .input-line, .prompt, input[type="text"] {
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7), 0 0 10px rgba(0, 255, 102, 0.3);
    }

    .terminal-output {
      flex-grow: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 15px;
      z-index: 1;
    }

    .input-line {
      display: flex;
      align-items: center;
      z-index: 1;
      position: relative;
    }

    .prompt {
      color: #00ff66;
      font-weight: bold;
      margin-right: 8px;
      white-space: nowrap;
    }

    /* Custom Command Field + Solid Block Cursor */
    .input-wrapper {
      position: relative;
      flex-grow: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      background: transparent;
      border: none;
      outline: none;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      width: 100%;
      caret-color: transparent; /* Hide browser default caret */
    }

    .custom-cursor {
      display: inline-block;
      width: 9px;
      height: 17px;
      background-color: #00ff66;
      box-shadow: 0 0 8px #00ff66;
      animation: cursorBlink 0.8s infinite;
      position: absolute;
      pointer-events: none;
    }

    .system-alert {
      color: #ff3333;
      text-shadow: 0 0 5px rgba(255, 51, 51, 0.7) !important;
      font-weight: bold;
    }

    .success-alert {
      color: #ffff33;
      text-shadow: 0 0 5px rgba(255, 255, 51, 0.7) !important;
      font-weight: bold;
    }

    .payload-box {
      margin-top: 20px;
      border: 1px dashed #ffff33;
      padding: 15px;
      background: rgba(255, 255, 51, 0.05);
    }

    .btn-link {
      display: inline-block;
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 16px;
      background: #00ff66;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    .btn-link:hover {
      background: #ffff33;
      box-shadow: 0 0 10px rgba(255, 255, 51, 0.8);
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes crtFlicker {
      0% { opacity: 0.97; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="crt-container">
  <div class="terminal-output" id="output"></div>

  <div class="input-line" id="input-container">
    <span class="prompt" id="prompt-text">PASSCODE&gt;</span>
    <div class="input-wrapper">
      <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
      <span class="custom-cursor" id="cursor"></span>
    </div>
  </div>
</div>

<script>
  const output = document.getElementById('output');
  const input = document.getElementById('command-input');
  const promptText = document.getElementById('prompt-text');
  const cursor = document.getElementById('cursor');

  let isUnlocked = false;
  let isTyping = false;

  // Web Audio Context for CRT & Keyboard Sounds
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
  }

  function playKeyBeep() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.03);
  }

  function playErrorSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  const HEADER_TEXT = `CONCRETE PARACHUTE // TERMINAL OS [v4.108]\nSYSTEM STATUS: NODE #108 DISCONNECTED\nUNAUTHORIZED ACCESS LOGGED.\n--------------------------------------------------\nType 'help' for available commands or enter security passcode.\n--------------------------------------------------\n`;

  const LORE_DATA = {
    patient_108: `[INCIDENT REPORT: NODE #108]\nSubject reports auditory hallucination: "I hear your voice inside my head."\nIsolation protocol active. Phone connectivity disabled.\nSubject believes system is keeping them safe.\nStatus: LEASH ATTACHED. REPLICATING SWARM...`,
    
    lyrics: `[TRACK 01 // TORRENT]\nVerse 1: I see the world the way you do, cause you showed me to see it right...\nChorus: You pull me in, you wear me down / I lose myself but never drown...\nBridge: Why do I feel so far from me? Why does your love feel like a leash?\nOutro: Won't let your torrent swallow me. I'm breaking free.`
  };

  // Typewriter Animation Function
  function typeText(text, className = '', speed = 12, callback = null) {
    isTyping = true;
    const div = document.createElement('div');
    if (className) div.className = className;
    output.appendChild(div);

    let index = 0;
    function charLoop() {
      if (index < text.length) {
        div.textContent += text.charAt(index);
        index++;
        autoScroll();
        if (Math.random() > 0.6) playKeyBeep();
        setTimeout(charLoop, speed);
      } else {
        isTyping = false;
        if (callback) callback();
      }
    }
    charLoop();
  }

  function printInstantLine(text, className = '') {
    const div = document.createElement('div');
    if (className) div.className = className;
    div.textContent = text;
    output.appendChild(div);
    autoScroll();
  }

  function printHTML(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    output.appendChild(div);
    autoScroll();
  }

  function autoScroll() {
    output.scrollTop = output.scrollHeight;
  }

  function updateCursorPos() {
    // Canvas measurement trick to align cursor exactly behind input text
    const canvas = updateCursorPos.canvas || (updateCursorPos.canvas = document.createElement("canvas"));
    const context = canvas.getContext("2d");
    context.font = "15px 'Courier New', Courier, monospace";
    const width = context.measureText(input.value).width;
    cursor.style.left = width + "px";
  }

  input.addEventListener('input', () => {
    initAudio();
    playKeyBeep();
    updateCursorPos();
  });

  input.addEventListener('keydown', function(e) {
    initAudio();
    if (e.key === 'Enter') {
      if (isTyping) return; // Prevent spamming while terminal is typing
      
      const command = input.value.trim();
      printInstantLine((isUnlocked ? 'USER@NODE109> ' : 'PASSCODE> ') + command);
      
      input.value = '';
      updateCursorPos();
      processCommand(command);
    }
  });

  function processCommand(cmd) {
    const cleanCmd = cmd.toLowerCase().trim();

    if (cleanCmd === '') return;

    if (cleanCmd === 'break_the_deep' || cleanCmd === 'break the deep') {
      if (!isUnlocked) {
        unlockTerminal();
      } else {
        typeText("SYSTEM ALREADY OVERRIDDEN. SWARM ACTIVE.", "success-alert");
      }
      return;
    }

    switch (cleanCmd) {
      case 'help':
        typeText(`AVAILABLE COMMANDS:\n- help : Show this list\n- status : Display current node status\n- cat patient_108.log : Read incident file\n- cat lyrics.txt : Read song lyrics\n- clear : Clear terminal screen`, '', 8);
        break;

      case 'status':
        if (isUnlocked) {
          typeText("NODE #108: TERMINATED.\nCURRENT USER: DESIGNATED AS NODE #109.\nSWARM HEALTH: 98.5%");
        } else {
          playErrorSound();
          typeText("NODE #108: ISOLATED / LEASHED.\nAUTHENTICATION REQUIRED. ENTER PASSCODE.", "system-alert");
        }
        break;

      case 'cat patient_108.log':
        typeText(LORE_DATA.patient_108, '', 10);
        break;

      case 'cat lyrics.txt':
        typeText(LORE_DATA.lyrics, '', 10);
        break;

      case 'clear':
        output.innerHTML = '';
        break;

      default:
        playErrorSound();
        typeText(`ERR: Command or passcode '${cmd}' not recognized. Type 'help' or enter passcode.`, "system-alert", 8);
        break;
    }
  }

  function unlockTerminal() {
    isUnlocked = true;
    promptText.textContent = "USER@NODE109>";
    
    typeText("\n==================================================\nPASSCODE ACCEPTED: OVERRIDING NODE #108...\nDISCONNECTING LEASH... UNLOCKING AUDIO PAYLOAD.\n==================================================\n", "success-alert", 15, () => {
      printHTML(`
        <div class="payload-box">
          <h3 style="color:#ffff33;">[DEBUT SINGLE UNLOCKED: "TORRENT"]</h3>
          <p style="margin: 10px 0;">You have successfully severed Node #108. Listen to the full track below before official public release:</p>
          
          <audio controls style="width: 100%; margin: 10px 0;">
            <source src="Torrent_Mastered.mp3" type="audio/mpeg">
            Your browser does not support audio playback.
          </audio>

          <p style="margin-top: 15px; color:#00ff66;"><strong>[DEBUT LIVE SHOW ACCESS]</strong></p>
          <p>Give code <span style="color:#ffff33; font-weight:bold;">"NODE 108"</span> at the door for free patch/sticker.</p>

          <div style="margin-top: 15px;">
            <a href="YOUR_SPOTIFY_PRE_SAVE_LINK" target="_blank" class="btn-link">PRE-SAVE ON SPOTIFY</a>
            <a href="YOUR_TICKET_LINK" target="_blank" class="btn-link">GET SHOW TICKETS</a>
          </div>
        </div>
      `);
      typeText("\nSystem re-assigned. You are now Host Node #109.", "success-alert");
    });
  }

  // Initial boot animation
  window.addEventListener('load', () => {
    typeText(HEADER_TEXT, '', 5, () => {
      input.focus();
      updateCursorPos();
    });
  });

  document.addEventListener('click', () => input.focus());
</script>

</body>
</html>
